# Testes automáticos em cada push e pull request.
# Corre os testes que não precisam do modelo treinado: contratos de dados, pré-processamento e
# decisão de desconto da app. Os testes do modelo correm no deploy-hf.yml, depois da pipeline.
name: CI

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: telco-churn-retention
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # igual ao Space (ZeroGPU suporta 3.10 e 3.12)
          cache: pip
          cache-dependency-path: telco-churn-retention/requirements-lock.txt

      - name: Instalar dependências (versões fixas)
        run: pip install -r requirements-lock.txt

      - name: Testes (dados, pré-processamento e app)
        run: pytest tests/test_data.py tests/test_preprocessing.py tests/test_app.py tests/test_bootstrap.py -v
