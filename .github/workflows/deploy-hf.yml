# Pipeline completa -> testes -> publicação no Hugging Face (só se tudo passar).
#
# Configuração no GitHub (Settings > Secrets and variables > Actions):
#   secret   HF_TOKEN        token do Hugging Face com permissão de escrita
#   variable HF_MODEL_REPO   opcional; por omissão tvf007/EDSBG1TP2-model (Model repo)
#   variable HF_SPACE        opcional; por omissão tvf007/EDSBG1TP2       (Space com a app)
name: Deploy Hugging Face

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "telco-churn-retention/**"
      - ".github/workflows/deploy-hf.yml"

concurrency:
  group: deploy-hf
  cancel-in-progress: false

jobs:
  pipeline-testes-publicacao:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Sem o secret HF_TOKEN, a pipeline e os testes correm na mesma, mas não se publica
      TEM_TOKEN_HF: ${{ secrets.HF_TOKEN != '' }}
    defaults:
      run:
        working-directory: telco-churn-retention
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # igual ao Space (ZeroGPU suporta 3.10 e 3.12)
          cache: pip
          cache-dependency-path: telco-churn-retention/requirements-lock.txt

      - name: Instalar dependências (versões fixas)
        run: pip install -r requirements-lock.txt huggingface_hub==2.4.0

      # Os contratos de dados correm aqui: um ficheiro fora do contrato pára o job
      - name: Pipeline (validação de dados, pré-processamento e modelação)
        run: python scripts/run_all.py --sem-profiling

      - name: Testes (incluindo os do modelo exportado)
        run: pytest tests -v

      - name: Aviso — publicação ignorada (falta HF_TOKEN)
        if: success() && env.TEM_TOKEN_HF != 'true'
        run: echo "::warning::Testes passaram, mas o secret HF_TOKEN não está definido; nada foi publicado."

      - name: Publicar modelo e app
        if: success() && env.TEM_TOKEN_HF == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          # Nomes públicos (não são segredo): usa a variável do repositório se existir, um
          # secret com o mesmo nome se tiver sido criado assim, e senão o valor do projeto.
          HF_MODEL_REPO: ${{ vars.HF_MODEL_REPO || secrets.HF_MODEL_REPO || 'tvf007/EDSBG1TP2-model' }}
          HF_SPACE: ${{ vars.HF_SPACE || secrets.HF_SPACE || 'tvf007/EDSBG1TP2' }}
        run: python scripts/publish_hf.py
